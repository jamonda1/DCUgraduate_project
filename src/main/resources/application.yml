server:
  port: 8080
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dcuproject?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    username: --
    password: --
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET NAMES utf8mb4
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

weather:
  apikey: --

ollama:
  api:
    url: http://localhost:11434

google:
  places:
    api-key: --

openai:
  api-key: --
